<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BO SALES</title>
    <script type="text/javascript">
      // เก็บ Path ที่ผู้ใช้พยายามเข้า เช่น /car แล้ว Redirect กลับไปหน้าแรกพร้อม Query Parameter
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').drop ? l.pathname.slice(1) : l.pathname.slice(1) +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
